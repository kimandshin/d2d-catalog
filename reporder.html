<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D2D Rep Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css"><!-- optional: reuse your catalog CSS -->
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f7;
      color: #111;
    }
    h2 {
      margin-top: 0;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .search-bar input,
    .search-bar select {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
    }
    .search-bar input {
      flex: 1;
    }
    #priceTable {
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-height: 420px;
      overflow: auto;
      margin-bottom: 16px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #e1e1e1;
      padding: 4px 6px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f1f1f1;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .order-panel {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .order-panel label {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .order-panel input[type="date"],
    .order-panel input[type="text"] {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
    }
    .order-panel input[type="text"] {
      width: 100%;
      box-sizing: border-box;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      background: #2563eb;
      color: #fff;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #orderStatus {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>D2D Rep Orders (Web)</h2>

  <div class="search-bar">
    <input id="customerSearch" type="text" placeholder="Search customer name or ID">
    <select id="customerSelect">
      <option value="">-- Select customer --</option>
    </select>
    <button class="btn" id="reloadBtn">Reload</button>
  </div>

  <div id="priceTable">
    <p>Select a customer to load their price sheet.</p>
  </div>

  <div class="order-panel">
    <h3>Create Order</h3>
    <div style="margin-bottom: 8px;">
      <label>
        Requested date:
        <input type="date" id="reqDate">
      </label>
    </div>
    <div style="margin-bottom: 8px;">
      <label>
        Note:
        <input type="text" id="note" placeholder="Optional note for this order">
      </label>
    </div>
    <button class="btn" id="submitBtn">Submit Order</button>
    <span id="orderStatus" style="margin-left: 8px;"></span>
  </div>

  <script>
    // TODO: replace with your Apps Script web app URL (the /exec URL)
    const API_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

    let customers = [];
    let currentCustomerId = null;
    let currentPriceData = null;

    async function apiCall(payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    async function loadCustomers() {
      document.getElementById('orderStatus').textContent = 'Loading customers...';
      try {
        const data = await apiCall({ action: 'getCustomers' });
        customers = data.customers || data || [];
        const sel = document.getElementById('customerSelect');
        sel.innerHTML = '<option value="">-- Select customer --</option>';
        customers.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.customerId;
          opt.textContent = c.customerId + ' - ' + c.name;
          sel.appendChild(opt);
        });
        document.getElementById('orderStatus').textContent = '';
      } catch (err) {
        document.getElementById('orderStatus').textContent = 'Error: ' + err.message;
      }
    }

    function filterCustomers() {
      const q = document.getElementById('customerSearch').value.toLowerCase();
      const sel = document.getElementById('customerSelect');
      sel.innerHTML = '<option value="">-- Select customer --</option>';
      customers
        .filter(c =>
          String(c.customerId).toLowerCase().includes(q) ||
          (c.name || '').toLowerCase().includes(q)
        )
        .forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.customerId;
          opt.textContent = c.customerId + ' - ' + c.name;
          sel.appendChild(opt);
        });
    }

    async function loadPriceSheet() {
      const sel = document.getElementById('customerSelect');
      const cid = sel.value;
      if (!cid) return;

      currentCustomerId = cid;
      document.getElementById('priceTable').innerHTML = '<p>Loading price sheet...</p>';
      document.getElementById('orderStatus').textContent = '';

      try {
        const data = await apiCall({ action: 'getPriceSheet', customerId: cid });
        currentPriceData = data;
        renderPriceSheet(data);
      } catch (err) {
        document.getElementById('priceTable').innerHTML = '<p>Error: ' + err.message + '</p>';
      }
    }

    function renderPriceSheet(data) {
      const container = document.getElementById('priceTable');

      if (!data || !data.headers || !data.rows || !data.rows.length) {
        container.innerHTML = '<p>No items found for this customer.</p>';
        return;
      }

      let html = '<table><thead><tr>';
      data.headers.forEach(h => {
        html += '<th>' + (h === '' ? '' : String(h)) + '</th>';
      });
      html += '<th>Qty</th></tr></thead><tbody>';

      data.rows.forEach((row, idx) => {
        html += '<tr>';
        row.forEach(cell => {
          html += '<td>' + (cell === '' || cell == null ? '' : String(cell)) + '</td>';
        });
        html += '<td><input type="number" min="0" data-row="' + idx + '" style="width:60px"></td>';
        html += '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function submitOrder() {
      if (!currentCustomerId || !currentPriceData) {
        document.getElementById('orderStatus').textContent = 'Select a customer and load items first.';
        return;
      }

      const inputs = document.querySelectorAll('#priceTable input[type="number"]');
      const items = [];
      inputs.forEach(input => {
        const qty = Number(input.value || 0);
        if (qty > 0) {
          const rowIdx = Number(input.dataset.row);
          const row = currentPriceData.rows[rowIdx];

          // Same structure: [0]=Alias, [1]=ItemName, [2]=DescriptionEn, [5]=SKU
          const sku = row[5];
          const description = row[2];

          items.push({
            sku: sku,
            description: description,
            qty: qty
          });
        }
      });

      if (!items.length) {
        document.getElementById('orderStatus').textContent = 'No quantities entered.';
        return;
      }

      const payload = {
        action: 'placeRepOrder',
        customerId: currentCustomerId,
        requestedDate: document.getElementById('reqDate').value,
        note: document.getElementById('note').value,
        orderItems: items
      };

      const statusEl = document.getElementById('orderStatus');
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      statusEl.textContent = 'Submitting order...';

      try {
        const res = await apiCall(payload);
        btn.disabled = false;
        statusEl.textContent = 'Order submitted. ID: ' + (res && res.orderId ? res.orderId : '(no id)');
      } catch (err) {
        btn.disabled = false;
        statusEl.textContent = 'Error: ' + err.message;
      }
    }

    document.getElementById('customerSearch').addEventListener('input', filterCustomers);
    document.getElementById('customerSelect').addEventListener('change', loadPriceSheet);
    document.getElementById('reloadBtn').addEventListener('click', loadCustomers);
    document.getElementById('submitBtn').addEventListener('click', submitOrder);

    // Initial load
    loadCustomers();
  </script>
</body>
</html>
