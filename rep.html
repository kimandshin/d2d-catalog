<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>D2D Rep Catalog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050608" />

  <link rel="stylesheet" href="style.css" />
  <!-- PWA manifest just for rep catalog -->
  <link rel="manifest" href="manifest-rep.json" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>D2D Rep Catalog <span class="rep-badge">Internal</span></h1>
        <p class="subtitle">Search products with cost and margin guidance.</p>
      </div>
    </header>

    <div class="toolbar-sticky">
      <div class="search-container">
        <input
          id="searchInput"
          type="text"
          placeholder="Search by name, SKU, supplier, type..."
        />
      </div>

      <div class="filters-row switches-row">
        <div class="filter-group small">
          <label class="switch">
            <input type="checkbox" id="inStockOnly" />
            <span class="switch-slider"></span>
          </label>
          <span class="switch-label">In stock only</span>
        </div>

        <div class="filter-group small">
          <label class="switch">
            <input type="checkbox" id="favoritesOnly" />
            <span class="switch-slider"></span>
          </label>
          <span class="switch-label">Favorites only</span>
        </div>

        <div class="filter-group small">
          <button type="button" class="btn btn-ghost" id="clearFavoritesBtn">
            Clear favorites
          </button>
        </div>

        <div class="filter-group small">
          <button type="button" class="btn btn-ghost" id="createListBtn">
            Create list with favorites
          </button>
        </div>

        <div class="filter-group small">
          <button type="button" class="btn btn-ghost" id="viewListsBtn">
            View saved lists
          </button>
        </div>
      </div>
    </div>

    <section class="controls">
      <div class="filters-row type-row">
        <div class="filter-group">
          <label class="filter-label">Type</label>
          <div id="typeFilter" class="type-filter"></div>
        </div>
      </div>
    </section>

    <section id="messageBar" class="message-bar hidden"></section>

    <main id="productList" class="product-list">
      <div class="empty-state">
        <div class="spinner"></div>
        <p>Loading rep catalog...</p>
      </div>
    </main>
  </div>

  <!-- we’ll reuse the same JS you already have in repUI -->
  <script>
    // === REPCATALOG FRONTEND ===
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxMWT5DmXFVb8JSJsDN6KzRzc4Zzim5mryiF9bQmc5AoC89ptSN96PDM1Pmkk6xdz07Bg/exec";

    let catalog = [];
    let filteredCatalog = [];
    let selectedTypes = new Set();
    let favorites = new Set();

    const productListEl     = document.getElementById("productList");
    const searchInputEl     = document.getElementById("searchInput");
    const typeFilterEl      = document.getElementById("typeFilter");
    const inStockOnlyEl     = document.getElementById("inStockOnly");
    const favoritesOnlyEl   = document.getElementById("favoritesOnly");
    const clearFavoritesBtn = document.getElementById("clearFavoritesBtn");
    const createListBtn     = document.getElementById("createListBtn");
    const viewListsBtn      = document.getElementById("viewListsBtn");
    const messageBarEl      = document.getElementById("messageBar");

    // incremental rendering
    const RENDER_BATCH_SIZE = 150;
    let renderLimit = RENDER_BATCH_SIZE;

    document.addEventListener("DOMContentLoaded", () => {
      loadFavoritesFromStorage();
      attachRepListeners();
      fetchRepCatalog();

      // infinite scroll
      window.addEventListener("scroll", () => {
        const scrollPos = window.innerHeight + window.scrollY;
        const docHeight = document.body.offsetHeight;
        if (scrollPos >= docHeight - 400) {
          if (renderLimit < filteredCatalog.length) {
            renderLimit += RENDER_BATCH_SIZE;
            renderCatalog();
          }
        }
      });

      // register service worker for offline
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("rep-sw.js")
          .catch(err => console.warn("SW registration failed", err));
      }
    });

    function attachRepListeners() {
      searchInputEl.addEventListener("input", applyFiltersAndRender);
      inStockOnlyEl.addEventListener("change", applyFiltersAndRender);
      favoritesOnlyEl.addEventListener("change", applyFiltersAndRender);

      clearFavoritesBtn.addEventListener("click", () => {
        if (!favorites.size) {
          setMessage("No favorites to clear.", "info", 2000);
          return;
        }
        if (!confirm("Clear all favorite items?")) return;
        favorites.clear();
        saveFavoritesToStorage();
        setMessage("Favorites cleared.", "info", 2000);
        applyFiltersAndRender();
      });

      createListBtn.addEventListener("click", handleCreateListFromFavorites);
      viewListsBtn.addEventListener("click", handleViewSavedLists);

      productListEl.addEventListener("click", (e) => {
        const card = e.target.closest(".product-card");
        if (!card) return;
        const itemId = card.getAttribute("data-item-id");
        if (!itemId) return;

        if (e.target.closest(".favorite-btn")) {
          toggleFavorite(itemId);
          renderCatalog();
        }
      });
    }

    async function fetchRepCatalog() {
      try {
        setMessage("Loading rep catalog...", "info", 0);
        productListEl.innerHTML = `
          <div class="empty-state">
            <div class="spinner"></div>
            <p>Loading rep catalog...</p>
          </div>
        `;
        const url = API_URL + "?action=repCatalog";
        const res = await fetch(url, { method: "GET", headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || "API error");

        catalog = data.data || [];
        buildTypeFilterChips();
        applyFiltersAndRender();
        setMessage("Rep catalog loaded.", "info", 1500);
      } catch (err) {
        console.error(err);
        productListEl.innerHTML = `
          <div class="empty-state">
            <p>Could not load rep catalog.</p>
          </div>
        `;
        setMessage("Error loading rep catalog: " + err.message, "error", 6000);
      }
    }

    function buildTypeFilterChips() {
      const typeSet = new Set();
      catalog.forEach(item => (item.types || []).forEach(t => typeSet.add(t)));
      typeFilterEl.innerHTML = "";
      Array.from(typeSet)
        .sort((a, b) => a.localeCompare(b))
        .forEach(type => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "type-chip";
          chip.dataset.type = type;
          chip.innerHTML = `<span class="dot"></span>${escapeHtml(type)}`;
          chip.addEventListener("click", () => {
            if (selectedTypes.has(type)) selectedTypes.delete(type);
            else selectedTypes.add(type);
            chip.classList.toggle("active", selectedTypes.has(type));
            applyFiltersAndRender();
          });
          typeFilterEl.appendChild(chip);
        });
    }

    function applyFiltersAndRender() {
      const search = (searchInputEl.value || "").toLowerCase().trim();
      const inStockOnly = inStockOnlyEl.checked;
      const favOnly = favoritesOnlyEl.checked;

      filteredCatalog = catalog.filter(item => {
        if (search) {
          const haystack = [
            item.productName,
            item.description,
            item.supplier,
            item.sku,
            item.type,
            item.memo
          ].filter(Boolean).join(" ").toLowerCase();
          if (!haystack.includes(search)) return false;
        }

        if (selectedTypes.size > 0) {
          const itemTypes = new Set(item.types || []);
          let hasMatch = false;
          selectedTypes.forEach(t => { if (itemTypes.has(t)) hasMatch = true; });
          if (!hasMatch) return false;
        }

        if (inStockOnly) {
          const stockVal = Number(item.stock || 0);
          if (!(stockVal > 0)) return false;
        }

        if (favOnly) {
          if (!favorites.has(String(item.itemId))) return false;
        }

        return true;
      });

      renderLimit = RENDER_BATCH_SIZE;
      renderCatalog();
    }

    function renderCatalog() {
      if (!filteredCatalog.length) {
        productListEl.innerHTML = `
          <div class="empty-state">
            <p>No products match your filters.</p>
          </div>
        `;
        return;
      }

      const slice = filteredCatalog.slice(0, renderLimit);
      const html = slice.map(item => {
        const isFav = favorites.has(String(item.itemId));
        const stockLabel =
          item.stock === "" || item.stock == null ? "N/A" : item.stock;

        const typesHtml = (item.types || [])
          .map(t => `<span class="tag">${escapeHtml(t)}</span>`)
          .join("");

        const descShort = (item.description || "").slice(0, 120);
        const desc =
          item.description && item.description.length > 120
            ? descShort + "…"
            : descShort;

        const imageHtml = item.pictureUrl
          ? `<img
               src="${escapeHtml(item.pictureUrl)}"
               alt="${escapeHtml(item.productName || "")}"
               class="product-thumb-img"
             />`
          : `<div class="product-thumb-fallback">📦</div>`;

        const pc  = item.purchaseCost;
        const qb  = item.qbPrice;
        const p25 = item.price25;
        const p40 = item.price40;

        return `
          <article class="product-card" data-item-id="${escapeHtml(String(item.itemId))}">
            <div class="product-thumb">
              ${imageHtml}
            </div>
            <div class="product-main">
              <div>
                <div class="product-header">
                  <div>
                    <h2 class="product-title">${escapeHtml(item.productName || "")}</h2>
                    <p class="product-subtitle">${escapeHtml(desc)}</p>
                  </div>
                  <button type="button" class="favorite-btn ${isFav ? "active" : ""}">
                    <span>${isFav ? "♥" : "♡"}</span>
                  </button>
                </div>
                <div class="product-meta">
                  <span class="meta-item">
                    <span class="meta-label">SKU:</span>
                    <span>${escapeHtml(item.sku || "-")}</span>
                  </span>
                  <span class="meta-item">
                    <span class="meta-label">Units/Box:</span>
                    <span>${escapeHtml(
                      item.unitsPerBox == null ? "-" : String(item.unitsPerBox)
                    )}</span>
                  </span>
                  <span class="meta-item">
                    <span class="meta-label">Stock:</span>
                    <span>${escapeHtml(String(stockLabel))}</span>
                  </span>
                  ${item.supplier
                    ? `<span class="meta-item"><span class="meta-label">Supplier:</span><span>${escapeHtml(item.supplier)}</span></span>`
                    : ""}
                </div>
                ${typesHtml ? `<div class="product-tags">${typesHtml}</div>` : ""}
              </div>
              <div class="rep-price-panel">
                <div>
                  <span class="rep-price-label">Cost</span><br>
                  <span class="rep-price-value">${formatMoney(pc)}</span>
                </div>
                <div>
                  <span class="rep-price-label">QB Price</span><br>
                  <span class="rep-price-value">${formatMoney(qb)}</span>
                </div>
                <div>
                  <span class="rep-price-label">25% Margin</span><br>
                  <span class="rep-price-value">${formatMoney(p25)}</span>
                </div>
                <div>
                  <span class="rep-price-label">40% Margin</span><br>
                  <span class="rep-price-value">${formatMoney(p40)}</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      productListEl.innerHTML = html;
    }

    function setMessage(text, type = "info", timeout = 3000) {
      if (!messageBarEl) return;
      messageBarEl.textContent = text || "";
      messageBarEl.className = "message-bar " + type;
      messageBarEl.classList.remove("hidden");
      if (timeout > 0) {
        setTimeout(() => { messageBarEl.classList.add("hidden"); }, timeout);
      }
    }

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatMoney(n) {
      if (n == null || n === "" || Number(n) === 0) return "-";
      const num = Number(n);
      if (!isFinite(num)) return "-";
      return "$" + num.toFixed(2);
    }

    function loadFavoritesFromStorage() {
      try {
        const raw = localStorage.getItem("d2dRepFavorites");
        if (!raw) return;
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          favorites = new Set(arr.map(v => String(v)));
        }
      } catch (err) {
        console.warn("Could not load rep favorites from storage:", err);
      }
    }

    function saveFavoritesToStorage() {
      const arr = Array.from(favorites);
      localStorage.setItem("d2dRepFavorites", JSON.stringify(arr));
    }

    function toggleFavorite(itemId) {
      const idStr = String(itemId);
      if (favorites.has(idStr)) {
        favorites.delete(idStr);
        setMessage("Removed from favorites.", "info", 1500);
      } else {
        favorites.add(idStr);
        setMessage("Added to favorites.", "info", 1500);
      }
      saveFavoritesToStorage();
    }

    // === Saved list stuff (same behavior as your old repUI) ===
    function handleCreateListFromFavorites() {
      const favItems = catalog.filter(item =>
        favorites.has(String(item.itemId))
      );

      if (!favItems.length) {
        setMessage("No favorites selected. Add some favorites first.", "info", 4000);
        return;
      }

      const listName = prompt("Enter a name for this list:");
      if (!listName || !listName.trim()) {
        setMessage("List not saved (no name entered).", "info", 3000);
        return;
      }

      const items = favItems.map(item => ({
        itemId: String(item.itemId),
        sku: item.sku || "",
        productName: item.productName || "",
        qbPrice: item.qbPrice || 0,
        price25: item.price25 || 0,
        price40: item.price40 || 0
      }));

      const payload = {
        listName: listName.trim(),
        items: items
      };

      setMessage("Saving rep list...", "info", 0);

      google.script.run
        .withSuccessHandler(function (result) {
          setMessage("Rep list saved as " + listName.trim() + ".", "info", 4000);
        })
        .withFailureHandler(function (err) {
          console.error(err);
          const msg = (err && err.message) ? err.message : String(err);
          setMessage("Failed to save rep list: " + msg, "error", 6000);
        })
        .repSaveListFromClient(payload);
    }

    function handleViewSavedLists() {
      setMessage("Loading saved rep lists...", "info", 0);

      google.script.run
        .withSuccessHandler(function (lists) {
          if (!lists || !lists.length) {
            setMessage("No saved lists found.", "info", 4000);
            return;
          }

          setMessage("", "info", 10);

          const names = lists.map(function (l, idx) {
            const count = (l.items && l.items.length) || 0;
            return (idx + 1) + ". " + (l.listName || l.listId) + " (" + count + " items)";
          }).join("\n");

          const choice = prompt(
            "Your saved lists:\n\n" + names + "\n\nEnter the number of the list to view:",
            "1"
          );
          if (!choice) return;
          const n = parseInt(choice, 10);
          if (!n || n < 1 || n > lists.length) {
            alert("Invalid choice.");
            return;
          }

          const selected = lists[n - 1];
          openRepListWindow(selected);
        })
        .withFailureHandler(function (err) {
          console.error(err);
          setMessage("Error loading saved lists: " + err.message, "error", 6000);
        })
        .getRepListsForClient();
    }

    function openRepListWindow(list) {
      const win = window.open("", "_blank");
      if (!win) {
        alert("Pop-up was blocked. Please allow pop-ups and try again.");
        return;
      }

      const rowsHtml = (list.items || [])
        .map(item => `
          <tr>
            <td>${escapeHtml(item.sku || "")}</td>
            <td>${escapeHtml(item.productName || "")}</td>
            <td>${formatMoney(item.qbPrice)}</td>
            <td>${formatMoney(item.price25)}</td>
            <td>${formatMoney(item.price40)}</td>
            <td>${formatMoney(item.customPrice)}</td>
            <td>${
              item.profitMargin != null && item.profitMargin !== ""
                ? escapeHtml(String(item.profitMargin)) + "%"
                : "-"
            }</td>
          </tr>
        `)
        .join("");

      const html = `
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="UTF-8" />
            <title>Rep List - ${escapeHtml(list.listName || "")}</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 16px; }
              h1 { font-size: 20px; margin-bottom: 4px; }
              p.subtitle { font-size: 12px; color:#555; margin-top:0; margin-bottom:12px; }
              table { width:100%; border-collapse:collapse; }
              th, td { border:1px solid #ccc; padding:6px 8px; font-size:12px; vertical-align:top; }
              th { background:#f7f7f7; }
            </style>
          </head>
          <body>
            <h1>${escapeHtml(list.listName || "Rep List")}</h1>
            <p class="subtitle">
              Rep: ${escapeHtml(list.repEmail || "")}<br>
              Use your browser's "Print" → "Save as PDF" to download this list.
            </p>
            <table>
              <thead>
                <tr>
                  <th>SKU</th>
                  <th>Product</th>
                  <th>QB Price</th>
                  <th>25% Margin</th>
                  <th>40% Margin</th>
                  <th>Custom Price</th>
                  <th>Profit %</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </body>
        </html>
      `;
      win.document.open();
      win.document.write(html);
      win.document.close();
    }
  </script>
</body>
</html>
